# Run `shopify app config link` once to connect this folder to your app in the
# Shopify Partner/Dev Dashboard; it fills in client_id for you.
client_id = ""
name = "Spooky Pin Deal"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
scopes = "write_discounts,read_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[webhooks]
api_version = "2026-07"

[build]
include_config_on_deploy = true
