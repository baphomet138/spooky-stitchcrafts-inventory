# Run once (in the GraphiQL window `shopify app dev` opens, press "g") to turn the
# deal on. It's an AUTOMATIC discount, so POS applies it by itself at checkout.
mutation CreatePinDeal {
  discountAutomaticAppCreate(
    automaticAppDiscount: {
      title: "Enamel Pins 4 for $20"
      functionHandle: "pin-deal-discount"
      discountClasses: [PRODUCT]
      startsAt: "2026-09-29T00:00:00Z"
      combinesWith: { orderDiscounts: true, productDiscounts: false, shippingDiscounts: true }
      metafields: [
        {
          namespace: "$app"
          key: "function-configuration"
          type: "json"
          value: "{\"bundleSize\":4,\"bundlePrice\":20}"
        }
      ]
    }
  ) {
    automaticAppDiscount { discountId title status }
    userErrors { field message }
  }
}
